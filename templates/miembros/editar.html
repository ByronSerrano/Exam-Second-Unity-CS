{% extends "base.html" %}

{% block content %}
<h2>Editar Miembro</h2>
<form method="post">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" value="{{ miembro.nombre }}" required>
    <br>
    <label for="edad">Edad:</label>
    <input type="number" id="edad" name="edad" value="{{ miembro.edad }}" required>
    <br>
    <button type="submit">Guardar Cambios</button>
</form>
{% endblock %}
