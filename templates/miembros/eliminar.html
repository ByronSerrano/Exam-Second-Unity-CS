{% extends "base.html" %}

{% block content %}
<h2>Eliminar Miembro</h2>
<p>¿Estás seguro de que deseas eliminar al miembro {{ miembro.nombre }}?</p>
<form method="post" action="/miembros/eliminar/{{ miembro.id }}">
    <button type="submit">Eliminar</button>
    <a href="/miembros/">Cancelar</a>
</form>
{% endblock %}
