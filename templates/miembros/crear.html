{% extends "base.html" %}

{% block content %}
<h2>Crear Competición</h2>
<form method="post" action="/competiciones/crear">
    <label for="name">Nombre</label>
    <input type="text" id="name" name="name" required>
    
    <label for="location">Ubicación</label>
    <input type="text" id="location" name="location" required>
    
    <label for="date">Fecha</label>
    <input type="datetime-local" id="date" name="date" required>
    
    <label for="miembros">Miembros</label>
    <select id="miembros" name="miembros" multiple>
        {% for miembro in miembros %}
        <option value="{{ miembro.id }}">{{ miembro.nombre }}</option>
        {% endfor %}
    </select>
    
    <button type="submit">Crear Competición</button>
</form>
{% endblock %}
