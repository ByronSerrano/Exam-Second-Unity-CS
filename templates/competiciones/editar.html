{% extends "base.html" %}

{% block content %}
<h2>Editar Competición</h2>
<form method="post" action="/competiciones/editar/{{ competicion.id }}">
    <label for="name">Nombre</label>
    <input type="text" id="name" name="name" value="{{ competicion.name }}" required>
    
    <label for="location">Ubicación</label>
    <input type="text" id="location" name="location" value="{{ competicion.location }}" required>
    
    <label for="date">Fecha</label>
    <input type="datetime-local" id="date" name="date" value="{{ competicion.date|replace(' ', 'T') }}" required>
    
    <label for="miembros">Miembros</label>
    <select id="miembros" name="miembros" multiple>
        {% for miembro in miembros %}
        <option value="{{ miembro.id }}" {% if miembro.id in competicion.members|map(attribute='id') %}selected{% endif %}>{{ miembro.nombre }}</option>
        {% endfor %}
    </select>
    
    <button type="submit">Actualizar Competición</button>
</form>
{% endblock %}
